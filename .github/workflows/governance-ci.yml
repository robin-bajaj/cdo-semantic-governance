name: CDO Governance CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  governance-tests:
    name: Validate contracts, semantic compilation, composition and generation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout governance source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install CDO governance package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Run complete governance test suite
        run: python -m pytest tests -q
      - name: Check canonical entry points
        run: |
          python -m cdo_governance.semantic.inheritance --help
          python -m cdo_governance.semantic.composition --help
          python -m cdo_governance.semantic.dbt_generator --help
          cdo-validate --help
