# Validate CDO business definitions and compiler/contract regressions before merge.
name: CDO Registry and Governance CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-registry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install governance package and test tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest
      - name: Validate all contract definitions and recursive dependencies
        run: python -m cdo_governance.semantic.registry --registry contracts
      - name: Run complete governance regression suite
        run: python -m pytest tests -q
