name: Generate CDO Enterprise Semantic Catalog

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CDO validator revision
        uses: actions/checkout@v4
        with:
          path: contract-validator

      - name: Checkout federated dbt POC source
        uses: actions/checkout@v4
        with:
          repository: robin-bajaj/federated-semantic-poc
          ref: main
          path: dbt-project
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dbt and CDO validator
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'dbt-core==1.12.6' 'dbt-postgres==1.11.0' ./contract-validator/cdo/validator

      - name: Configure parse-only adapter
        run: |
          mkdir -p dbt-project/.ci
          cat > dbt-project/.ci/profiles.yml <<'PROFILE'
          default:
            target: ci
            outputs:
              ci:
                type: postgres
                host: localhost
                port: 5432
                user: ci
                password: ci
                dbname: ci
                schema: ci
                threads: 1
          PROFILE

      - name: Compile Team A/C semantic inheritance
        working-directory: dbt-project
        run: |
          python -m meta_context_validator.compile_semantics \
            --registry ../contract-validator/cdo/definitions/position_v1.yml \
            --project .

      - name: Parse compiled dbt project
        working-directory: dbt-project
        run: |
          if [ -f packages.yml ] || [ -f dependencies.yml ]; then
            dbt deps --profiles-dir .ci
          fi
          dbt parse --profiles-dir .ci --no-partial-parse

      - name: Compose versioned CDO catalog
        working-directory: dbt-project
        run: |
          python -m meta_context_validator.compose_cdo \
            --project . \
            --contract ../contract-validator/cdo/definitions/position_v1.yml \
            --manifest target/manifest.json \
            --enterprise-metrics models/semantic_models/team_cdo/enterprise_metrics.yml \
            --require-semantic-model team_a_equity_positions \
            --require-semantic-model team_c_fi_positions \
            --output generated/cdo/position/v1/cdo_enterprise_positions.yml

      - name: Upload generated catalog
        uses: actions/upload-artifact@v4
        with:
          name: cdo-enterprise-position-catalog
          path: dbt-project/generated/cdo/position/v1/cdo_enterprise_positions.yml
          if-no-files-found: error
