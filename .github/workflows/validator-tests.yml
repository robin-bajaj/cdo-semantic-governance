name: CDO Validator Unit Tests

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout validator
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install validator and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ./cdo/validator pytest
      - name: Run validator unit tests
        run: python -m pytest cdo/validator/tests -q
