# CDO-owned unified Position semantic definition (CUSTOM registry format).
# This is NOT a native dbt semantic_model YAML resource. CDO describes the
# mandatory data interface and reusable metric specification independently
# of Team A or Team C's physical models.
name: cdo.position
version: 1
owner: CDO
description: >
  Enterprise Position business concept. Teams independently supply compliant
  position-level values; CDO governs the common attribute types and metric
  aggregation without prescribing the team's physical table or model name.

# Single canonical source for required column names/types AND inherited semantic
# properties. All semantic_columns are mandatory for opted-in CDO models.
# This custom DSL compiles into native dbt model properties before dbt parses.
agg_time_dimension: report_date
semantic_columns:
  - name: position_id
    data_type: text
    description: Enterprise position identifier
    entity:
      name: position
      type: primary
  - name: report_date
    data_type: date
    granularity: day
    dimension:
      type: time
  - name: profit_loss
    data_type: numeric
    description: Standardized position profit and loss
  - name: instrument_code
    data_type: integer
    entity:
      name: instrument
      type: foreign

# Require all opted-in CDO Position implementations to enable native dbt model
# contract enforcement. Actual physical validation still needs dbt build.
require_native_contract: true

metrics:
  - name: cdo.profit_loss
    version: 1
    label: Profit and Loss
    description: >
      Total position profit and loss measured as the sum of standardized
      position-level profit_loss values over the query's dimensions and date.
    owner: CDO
    metric:
      type: simple
      agg: sum
      expr: profit_loss
      fill_nulls_with: 0
