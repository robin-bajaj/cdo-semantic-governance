name: cdo.position
version: 1

attributes:
  - name: position_id
    data_type: text
    description: Position identifier

  - name: report_date
    data_type: date
    description: Business reporting date

  - name: profit_loss
    data_type: numeric
    description: Standardized profit and loss

  - name: instrument_code
    data_type: integer
    description: Financial instrument identifier

metrics:
  - name: profit_loss
    description: Total position profit and loss
    type: simple
    agg: sum
    expr: profit_loss
    fill_nulls_with: 0
