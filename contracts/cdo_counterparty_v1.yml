# Logical Counterparty concept. It inherits rather than duplicating shared definitions.
# No physical dbt model or join is implied by this declaration.
name: cdo.counterparty
version: 1
uses:
  name: cdo.all
  version: 1

include:
  attributes:
    - counterparty_id
    - counterparty_name
    - counterparty_type
  metrics: []
